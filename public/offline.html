<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>שאבעס מרקט</title>
<style>
:root{--bg:#EDF0F5;--ink:#131C2B;--muted:#5A6577;--accent:#25528D;--accent-ink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0C1220;--ink:#E7ECF4;--muted:#95A0B3;--accent:#86A9E0;--accent-ink:#0A1426;color-scheme:dark}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Segoe UI',Arial,sans-serif;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
.m{width:110px;height:110px;border-radius:24px;display:block;margin:0 auto 18px}
h1{font-size:24px;margin:0 0 8px}
p{color:var(--muted);margin:0 0 22px;line-height:1.5}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 28px;background:var(--accent);color:var(--accent-ink)}
</style>
</head>
<body>
<div>
  <img class="m" src="logo.png" alt="">
  <h1>אין חיבור לאינטרנט</h1>
  <p>שאבעס מרקט צריך אינטרנט כדי לטעון את הנתונים של החנות.<br>בדקו את ה-Wi-Fi או את הנתונים הסלולריים.</p>
  <button onclick="location.href='https://nn0548444087-creator.github.io/dalpak/'">לנסות שוב</button>
</div>
</body>
</html>
